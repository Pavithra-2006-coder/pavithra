name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository files
        run: |
          echo "CI workflow is running"
          echo "Repository files:"
          ls -la

      - name: Test files
        run: |
          test -f file1.txt
          test -f file3.txt
          echo "All required files exist"
